server {
  listen 80;

  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text responses; the JavaScript bundles shrink to a third or less.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "healthy\n";
  }

  # Built files carry a content hash in their names, so browsers may keep them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The page itself is always rechecked, so a new deployment is picked up at once.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
