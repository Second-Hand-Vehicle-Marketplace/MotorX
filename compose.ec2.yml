# Single-server (EC2) deployment override. compose.yml publishes every port on 127.0.0.1 only,
# which is right on a laptop but makes the site unreachable on a server. This file opens only the
# website (4173) and the API (3000) to the network; Redis and MinIO stay private to the machine.
#
#   docker compose -f compose.yml -f compose.ec2.yml up -d --build
#
# Needs Docker Compose v2.24 or newer (for !override). In the EC2 security group allow inbound
# 4173 and 3000 from the people who should use the site, and 22 (SSH) from your own IP only.
services:
  backend:
    ports: !override
      - "3000:3000"
  frontend:
    # The production image: the site is built once and served by nginx, compressed and cached,
    # instead of the Vite development server used on laptops. The VITE_* values from .env are
    # built into the files, so rebuild this image after changing them:
    #   docker compose -f compose.yml -f compose.ec2.yml build frontend
    build:
      dockerfile: infrastructure/docker/frontend.production.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    ports: !override
      - "4173:80"
