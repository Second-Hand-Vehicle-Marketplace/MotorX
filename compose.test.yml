# Separate project name so a test run never replaces the local "motorx" dev
# containers or volumes, and no published ports so it can run alongside them.
name: motorx-test

services:
  mongodb:
    image: mongo:7
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all

    environment:
      MONGO_INITDB_DATABASE: motorx_test

    tmpfs:
      - /data/db

    volumes: !reset []

    # The backend and worker only join motorx-network, so MongoDB must too.
    networks:
      - motorx-network

    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mongodb-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - mongodb:27017
      - --eval
      - 'try { rs.status() } catch (error) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }) }'
    networks:
      - motorx-network

  redis:
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    tmpfs:
      - /data

    volumes: !reset []
    ports: !reset []

  minio:
    tmpfs:
      - /data

    volumes: !reset []
    ports: !reset []

  minio-init:
    environment:
      S3_BUCKET: motorx-test

  backend:
    # The slim production image has no Vitest; tests use the development stage.
    build:
      target: development

    environment:
      NODE_ENV: test

      MONGODB_URI: mongodb://mongodb:27017/motorx_test?replicaSet=rs0
      TEST_MONGODB_URI: mongodb://mongodb:27017/motorx_test?replicaSet=rs0
      REDIS_URL: redis://redis:6379

      S3_BUCKET: motorx-test
      LOG_LEVEL: error

    depends_on:
      mongodb-init:
        condition: service_completed_successfully

    # Test files share one database, so run them serially (matches CI).
    command: npm run test --workspace @motorx/backend -- --maxWorkers=1
    ports: !reset []

  worker:
    build:
      target: development

    environment:
      NODE_ENV: test

      MONGODB_URI: mongodb://mongodb:27017/motorx_test?replicaSet=rs0
      TEST_MONGODB_URI: mongodb://mongodb:27017/motorx_test?replicaSet=rs0
      REDIS_URL: redis://redis:6379

      S3_BUCKET: motorx-test
      LOG_LEVEL: error

    depends_on:
      mongodb-init:
        condition: service_completed_successfully

    command: npm run test --workspace @motorx/worker -- --maxWorkers=1

  frontend:
    profiles:
      - frontend-tests
    ports: !reset []
