services:
  backend:
    command: npm run dev --workspace @motorx/backend
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    develop:
      watch:
        - action: sync
          path: ./apps/backend/src
          target: /app/apps/backend/src
        - action: sync
          path: ./packages/shared-contracts/src
          target: /app/packages/shared-contracts/src
        - action: rebuild
          path: ./apps/backend/package.json
        - action: rebuild
          path: ./package.json

  worker:
    command: npm run dev --workspace @motorx/worker
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      WORKER_CONCURRENCY: 2
    develop:
      watch:
        - action: sync
          path: ./apps/worker/src
          target: /app/apps/worker/src
        - action: sync
          path: ./packages/shared-contracts/src
          target: /app/packages/shared-contracts/src
        - action: rebuild
          path: ./apps/worker/package.json
        - action: rebuild
          path: ./package.json

  frontend:
    command: npm run dev --workspace @motorx/frontend -- --host 0.0.0.0
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    develop:
      watch:
        - action: sync
          path: ./apps/frontend/src
          target: /app/apps/frontend/src
        - action: sync
          path: ./apps/frontend/public
          target: /app/apps/frontend/public
        - action: sync
          path: ./packages/shared-contracts/src
          target: /app/packages/shared-contracts/src
        - action: rebuild
          path: ./apps/frontend/package.json
        - action: rebuild
          path: ./package.json
