name: CI

on:
  push:
    branches:
      - main
      - dewni
  pull_request:
    branches:
      - main
      - dewni
  workflow_dispatch:
  # Weekly rebuild and rescan of main: new vulnerabilities are published all the
  # time, so an unchanged image can become vulnerable without any code change.
  # (deploy.yml ignores scheduled runs, so this never redeploys by itself.)
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # Scan every commit: a secret deleted later still lives in history.
          fetch-depth: 0

      # Pinned by digest so a re-tagged image can never change what runs here.
      # Known historical findings are listed in .gitleaksignore; rules in .gitleaks.toml.
      - name: Run Gitleaks
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo
          --config /repo/.gitleaks.toml
          --gitleaks-ignore-path /repo/.gitleaksignore
          --redact
          --no-banner
          --exit-code 1

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      NODE_ENV: test
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/motorx_test?replicaSet=rs0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start MongoDB replica set
        run: |
          docker run -d \
            --name mongodb \
            --network host \
            mongo:7 \
            mongod --replSet rs0 --bind_ip_all

          until docker exec mongodb mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok"; do
            sleep 2
          done

          docker exec mongodb mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet

      - name: Build shared contracts
        run: npm run build --workspace @motorx/shared-contracts

      - name: Build backend
        run: npm run build --workspace @motorx/backend

      - name: Build worker
        run: npm run build --workspace @motorx/worker

      - name: Build frontend
        run: npm run build --workspace @motorx/frontend

      - name: Test backend
        run: npm test --workspace @motorx/backend -- --maxWorkers=1

      - name: Test worker
        run: npm test --workspace @motorx/worker -- --maxWorkers=1

      - name: Test frontend
        run: npm test --workspace @motorx/frontend

  docker-build:
    name: Build ${{ matrix.component }} image
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: infrastructure/docker/backend.Dockerfile
          - component: worker
            dockerfile: infrastructure/docker/worker.Dockerfile
          - component: frontend
            dockerfile: infrastructure/docker/frontend.production.Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: >-
          docker build
          --file ${{ matrix.dockerfile }}
          --tag motorx-${{ matrix.component }}:${{ github.sha }}
          .

      # Scans the OS packages, Node.js itself, and npm packages inside the image,
      # which npm audit cannot see. Fails on HIGH/CRITICAL issues that already have
      # a fix; unfixable ones are reported without blocking the release.
      - name: Scan image for vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          --no-progress
          motorx-${{ matrix.component }}:${{ github.sha }}
